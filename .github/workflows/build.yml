name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build
        shell: pwsh
        env:
          FALLBACK_SUB: ${{ secrets.FALLBACK_SUB }}
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          wails build -platform windows/amd64 -o Fortochka.exe -ldflags "-s -w -X main.version=$v -X main.fallbackSub=$env:FALLBACK_SUB" -trimpath
      - name: Bundle sing-box
        shell: pwsh
        run: |
          $tag = (Invoke-RestMethod https://api.github.com/repos/SagerNet/sing-box/releases/latest).tag_name
          $ver = $tag.TrimStart('v')
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/releases/download/$tag/sing-box-$ver-windows-amd64.zip" -OutFile sb.zip
          Expand-Archive sb.zip -DestinationPath sbdir -Force
          $sb = (Get-ChildItem sbdir -Recurse -Filter sing-box.exe | Select-Object -First 1).FullName
          Copy-Item $sb build/bin/
      - name: Bundle DPI engines (byedpi + zapret)
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            $bd = (Invoke-RestMethod https://api.github.com/repos/hufrea/byedpi/releases/latest).assets |
              Where-Object { $_.name -match 'win' -and $_.name -match '\.zip$' } | Select-Object -First 1
            if ($bd) {
              Invoke-WebRequest $bd.browser_download_url -OutFile bd.zip
              Expand-Archive bd.zip -DestinationPath bddir -Force
              $x = (Get-ChildItem bddir -Recurse -Filter byedpi.exe | Select-Object -First 1)
              if ($x) { Copy-Item $x.FullName build/bin/ }
            }
          } catch { Write-Host "byedpi bundle skipped: $_" }
          try {
            $zp = (Invoke-RestMethod https://api.github.com/repos/bol-van/zapret/releases/latest).assets |
              Where-Object { $_.name -match 'win' -and $_.name -match '\.zip$' } | Select-Object -First 1
            if ($zp) {
              Invoke-WebRequest $zp.browser_download_url -OutFile zp.zip
              Expand-Archive zp.zip -DestinationPath zpdir -Force
              foreach ($n in 'winws.exe','WinDivert.dll','WinDivert64.sys') {
                $f = (Get-ChildItem zpdir -Recurse -Filter $n | Select-Object -First 1)
                if ($f) { Copy-Item $f.FullName build/bin/ }
              }
            }
          } catch { Write-Host "zapret bundle skipped: $_" }
      - name: Sign binaries (only if a cert is configured)
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERT_PFX }}
          PFX_PWD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\cs.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $st = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $st sign /f $pfx /p $env:PFX_PWD /fd SHA256 /tr http://timestamp.sectigo.com /td SHA256 build/bin/Fortochka.exe build/bin/sing-box.exe
          Remove-Item $pfx -Force
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path build/bin/* -DestinationPath "Fortochka.zip" -Force
          Copy-Item "Fortochka.zip" "Fortochka-$v.zip"
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Fortochka.zip
            Fortochka-*.zip

  deploy-cdn:
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Sync Fortochka.zip to OVH CDN
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            if [ -x /usr/local/bin/fortochka-client-sync ]; then
              /usr/local/bin/fortochka-client-sync
            else
              python3 /home/ubuntu/graph-tools/sync-fortochka-client.py
            fi
            curl -fsSI 'https://vpn.rungvard.net/d/a3b35285e291afd3/Fortochka.zip' | rg -i content-length

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build
        env:
          FALLBACK_SUB: ${{ secrets.FALLBACK_SUB }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          wails build -platform linux/amd64 -tags webkit2_41 -o Fortochka -ldflags "-s -w -X main.version=$v -X main.fallbackSub=$FALLBACK_SUB" -trimpath
      - name: Bundle sing-box
        run: |
          TAG=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep -m1 tag_name | cut -d '"' -f4)
          VER=${TAG#v}
          curl -sL -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/${TAG}/sing-box-${VER}-linux-amd64.tar.gz"
          tar -xzf sb.tgz --strip-components=1 -C build/bin "sing-box-${VER}-linux-amd64/sing-box"
      - name: Package
        run: |
          v="${GITHUB_REF_NAME#v}"
          tar -czf "Fortochka-linux.tar.gz" -C build/bin .
          cp "Fortochka-linux.tar.gz" "Fortochka-$v-linux.tar.gz"
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Fortochka-linux.tar.gz
            Fortochka-*-linux.tar.gz
