<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fortochka</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .split-block{margin-top:14px;border-top:1px solid rgba(255,255,255,.1);padding-top:14px;text-align:left}
    .split-toggle{display:flex;align-items:center;gap:10px;font-size:13.5px;cursor:pointer;margin-bottom:12px;line-height:1.4}
    .split-toggle input{width:17px;height:17px;flex:none;accent-color:#4fd1c5;cursor:pointer}
    .split-label{display:block;font-size:12px;color:#8a93a3;margin:12px 0 5px}
    .split-label small{opacity:.7}
    #bypassApps,#bypassSites{width:100%;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);border-radius:8px;
      color:#e8ecf1;font:inherit;font-size:13px;padding:9px 11px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;outline:none}
    #bypassApps:focus,#bypassSites:focus{border-color:#4fd1c5}
    .updbar{display:flex;align-items:center;gap:10px;justify-content:center;padding:8px 14px;background:rgba(79,209,197,.12);border-bottom:1px solid rgba(79,209,197,.25);font-size:13px;color:#cdeeea}
    .updbar button{background:#4fd1c5;border:none;color:#06201d;font:inherit;font-weight:700;font-size:12.5px;padding:5px 12px;border-radius:7px;cursor:pointer}
    .updbar button:hover{filter:brightness(1.06)}
    .updbar button:disabled{opacity:.6;cursor:default}
  </style>
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="logo">
        <span class="tick"></span>
        Fortochka
      </div>
      <div class="tools">
        <button class="gear" id="logs" title="Логи" aria-label="Логи">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M4 5h16M4 10h16M4 15h10M4 20h6"/>
          </svg>
        </button>
        <button class="gear" id="gear" title="Настройки" aria-label="Настройки">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="updbar hidden" id="updbar">
      <span id="updtext">Доступна новая версия</span>
      <button id="updbtn">Обновить</button>
    </div>

    <main class="stage">
      <div class="shield" id="shield">
        <svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M12 2 4 5v6c0 5 3.4 8.5 8 11 4.6-2.5 8-6 8-11V5l-8-3Z"/>
          <path class="check" d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <div class="status" id="status">Отключено</div>
      <div class="sub" id="sub">Нажмите, чтобы подключиться</div>

      <button class="power" id="power">Подключиться</button>
    </main>

    <footer class="foot" id="foot"></footer>
  </div>

  <div class="sheet hidden" id="sheet">
    <div class="sheet-card">
      <div class="sheet-title">Ссылка Fortochka</div>
      <p class="sheet-hint">Вставьте что вам дали — подписку, vless:// или hiddify://. Можно несколько vless-ссылок в столбик.</p>
      <textarea id="link" rows="4" spellcheck="false" placeholder="vless://…  или  http://…/sub/…  или  hiddify://import/…"></textarea>

      <div class="split-block">
        <label class="split-toggle">
          <input type="checkbox" id="bypassRu" />
          <span>Российские сайты — напрямую <small style="color:#8a93a3">(быстрее, не ломает банки и госуслуги)</small></span>
        </label>
        <label class="split-label">Приложения мимо Форточки <small>(по одному в строке: chrome.exe)</small></label>
        <textarea id="bypassApps" rows="2" spellcheck="false" placeholder="chrome.exe&#10;steam.exe"></textarea>
        <label class="split-label">Сайты мимо Форточки <small>(по одному в строке: example.com)</small></label>
        <textarea id="bypassSites" rows="2" spellcheck="false" placeholder="gosuslugi.ru&#10;sberbank.ru"></textarea>
      </div>

      <div class="sheet-row">
        <button class="ghost" id="cancel">Отмена</button>
        <button class="save" id="save">Сохранить</button>
      </div>
    </div>
  </div>

  <div class="sheet hidden" id="logsheet">
    <div class="sheet-card">
      <div class="sheet-title">Журнал</div>
      <pre class="logbox" id="logbox"></pre>
      <div class="sheet-row">
        <button class="ghost" id="logclose">Закрыть</button>
        <button class="ghost" id="logcopy">Копировать</button>
        <button class="save" id="logrefresh">Обновить</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
